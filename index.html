<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0d0d0d;
    color: #e0e0e0;
    min-height: 100vh;
  }
  header {
    text-align: center;
    padding: 48px 20px 32px;
  }
  header h1 {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 2px;
    color: #fff;
  }
  header p {
    margin-top: 8px;
    color: #888;
    font-size: 14px;
  }
  .gallery {
    padding-bottom: 48px;
  }
  .gallery .card {
    position: relative;
    cursor: pointer;
    background: #1a1a1a;
    overflow: hidden;
    font-size: 0;
    line-height: 0;
  }
  .gallery .card:not(:last-child) {
    margin-bottom: 4px;
  }
  /* 模糊占位图 */
  .card .thumb {
    width: 100%;
    height: auto;
    display: block;
    filter: blur(20px);
    transform: scale(1.1);
  }
  /* 清晰图叠在上面，加载完后淡入 */
  .card .full {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    opacity: 0;
    transition: opacity 0.5s ease;
  }
  .card .full.loaded {
    opacity: 1;
  }
  .card .number {
    position: absolute;
    bottom: 12px;
    right: 12px;
    background: rgba(0,0,0,0.55);
    color: #fff;
    font-size: 12px;
    padding: 3px 8px;
    border-radius: 4px;
    backdrop-filter: blur(6px);
    pointer-events: none;
    z-index: 2;
  }

  /* lightbox */
  .lightbox {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.94);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    cursor: zoom-out;
  }
  .lightbox.active { display: flex; }
  .lightbox img {
    max-width: 95vw;
    max-height: 95vh;
    object-fit: contain;
    border-radius: 4px;
    box-shadow: 0 0 60px rgba(0,0,0,0.6);
    cursor: default;
  }
  .lightbox .close {
    position: absolute;
    top: 20px;
    right: 28px;
    font-size: 32px;
    color: #aaa;
    cursor: pointer;
    line-height: 1;
    user-select: none;
    z-index: 2;
    transition: color 0.2s;
  }
  .lightbox .close:hover { color: #fff; }
  .lightbox .nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: 48px;
    color: #aaa;
    cursor: pointer;
    user-select: none;
    padding: 20px;
    z-index: 2;
    transition: color 0.2s;
  }
  .lightbox .nav:hover { color: #fff; }
  .lightbox .prev { left: 4px; }
  .lightbox .next { right: 4px; }
  .lightbox .counter {
    position: absolute;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    color: #888;
    font-size: 14px;
    z-index: 2;
  }

  footer {
    text-align: center;
    padding: 20px;
    color: #555;
    font-size: 12px;
  }
</style>
</head>

<div class="lightbox" id="lightbox">
  <span class="close" id="closeBtn">&times;</span>
  <span class="nav prev" id="prevBtn">&lsaquo;</span>
  <span class="nav next" id="nextBtn">&rsaquo;</span>
  <img src="" alt="" id="lightboxImg">
  <span class="counter" id="counter"></span>
</div>

<footer>作品集 · 图片已 WebP 优化（31.6MB → 4.5MB）</footer>

<script>
  const TOTAL = 34;
  // 收集所有清晰图引用
  const fullImages = document.querySelectorAll('.card .full');
  const images = [];  // lightbox 用的路径

  // 图片加载完成后淡入，隐藏模糊占位
  fullImages.forEach(function(img) {
    images.push(img.src);
    if (img.complete) {
      img.classList.add('loaded');
    } else {
      img.addEventListener('load', function() {
        img.classList.add('loaded');
      });
      img.addEventListener('error', function() {
        img.classList.add('loaded');
      });
    }
  });

  // lightbox
  var lightbox = document.getElementById('lightbox');
  var lightboxImg = document.getElementById('lightboxImg');
  var counter = document.getElementById('counter');
  var currentIndex = 0;

  function openLightbox(index) {
    currentIndex = index;
    showImage();
    lightbox.classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox() {
    lightbox.classList.remove('active');
    document.body.style.overflow = '';
  }

  function showImage() {
    var num = String(currentIndex + 1).padStart(2, '0');
    lightboxImg.src = images[currentIndex];
    lightboxImg.alt = '作品 ' + num;
    counter.textContent = (currentIndex + 1) + ' / ' + TOTAL;
  }

  function nextImage() {
    currentIndex = (currentIndex + 1) % TOTAL;
    showImage();
  }

  function prevImage() {
    currentIndex = (currentIndex - 1 + TOTAL) % TOTAL;
    showImage();
  }

  document.getElementById('closeBtn').addEventListener('click', function(e) {
    e.stopPropagation();
    closeLightbox();
  });
  document.getElementById('prevBtn').addEventListener('click', function(e) {
    e.stopPropagation();
    prevImage();
  });
  document.getElementById('nextBtn').addEventListener('click', function(e) {
    e.stopPropagation();
    nextImage();
  });
  lightbox.addEventListener('click', closeLightbox);
  lightboxImg.addEventListener('click', function(e) { e.stopPropagation(); });

  document.addEventListener('keydown', function(e) {
    if (!lightbox.classList.contains('active')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowRight') nextImage();
    if (e.key === 'ArrowLeft') prevImage();
  });
</script>
